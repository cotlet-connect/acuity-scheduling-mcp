[project]
name = "acuity-scheduling-mcp"
version = "1.1.0"
description = "Connect Acuity Scheduling to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Acuity Scheduling API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["acuity scheduling", "acuity scheduling api", "acuity scheduling mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/acuity-scheduling-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=acuity-scheduling"
Source = "https://github.com/cotlet-connect/acuity-scheduling-mcp"

[project.scripts]
acuity-scheduling-mcp = "acuity_scheduling_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"acuity_scheduling_agent.py" = "acuity_scheduling_agent.py"

[tool.hatch.build.targets.sdist]
include = ["acuity_scheduling_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
